[package]
name = "toon-helper"
version = "0.1.0"
edition = "2021"
description = "Shared TOON (Token-Oriented Object Notation) output helpers for AXI-compliant CLIs"
authors = ["Ishan Parihar"]
license = "MIT"

[dependencies]
toon-format = { version = "0.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
